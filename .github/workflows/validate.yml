name: Validate ontologies (rudof SHACL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rudof-v0.2.8

      - name: Install rudof
        run: |
          if ! command -v rudof >/dev/null; then
            cargo install --locked rudof_cli --version 0.2.8
          fi
          rudof --version

      - name: Read ontology quality gate whitelist
        id: whitelist
        run: |
          whitelist=$(grep -v '^#' docs-published.txt | grep -v '^$' || true)
          if [ -z "$whitelist" ]; then
            echo "Bootstrap phase: no ontologies whitelisted. Skipping validation."
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "$whitelist" | tee /tmp/whitelist.txt
            count=$(echo "$whitelist" | wc -l)
            echo "count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate whitelisted TTLs
        if: steps.whitelist.outputs.count != '0'
        run: |
          set -euo pipefail
          ratchet_floor=50
          while IFS=';' read -r ttl_path badge audit_path publish_date; do
            [ -z "$ttl_path" ] && continue
            echo "==> Validating $ttl_path (badge=$badge, audit=$audit_path, date=$publish_date)"
            if [ ! -f "$ttl_path" ]; then
              echo "::error::Whitelisted TTL not found: $ttl_path"
              exit 1
            fi
            # Structural parse gate for every whitelisted TTL. Real SHACL
            # falsifiability runs in the next step (tests/shacl harness).
            rudof data -r turtle "$ttl_path" > /dev/null
          done < /tmp/whitelist.txt

      - name: Landing-generator registry tests (pytest)
        run: |
          set -euo pipefail
          # Guards the CANONICAL_TTL / MIRRORS / STATIC_LANDINGS registries in
          # build_namespace_landings.py against drift: every publication that
          # adds a whitelist row must extend the generator registry, or the
          # registry-shape test fails here instead of the deploy-time E2E
          # probe (grop 0.1.1 incident, 2026-07-11: generator drifted two
          # publications behind while the suite sat red and unwired).
          pip install --quiet pytest
          python3 -m pytest tests/test_build_namespace_landings.py -q

      - name: SHACL falsifiability harness (real SHACL, not parse-only)
        run: |
          set -euo pipefail
          # Proves whitelisted .shapes.ttl actually FIRE (are not vacuous). rudof
          # 0.2.8 silently no-ops sh:sparql / sh:SPARQLTarget; dormant published
          # shapes are quarantined as known-dormant (XFAIL) and flip to required
          # green when their re-encoded P0 bytes are published. Campaign:
          # rudof-sparql-revalidation-2026-06-22 (bra0_meta ADR-135 / 9c15bc4).
          bash tests/shacl/run-shacl-falsifiability.sh

      - name: Summary
        run: |
          echo "Whitelisted ontologies: ${{ steps.whitelist.outputs.count }}"
          echo "Ratchet floor: 50 (coupled-stack baseline, audit-orthogonal)"
